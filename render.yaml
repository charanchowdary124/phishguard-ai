services:
  - type: web
    name: phishguard-ai-demo-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/health
    autoDeployTrigger: "off"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_TIMEOUT_MINUTES
        value: "30"
      - key: TRUSTED_PROXY_INTERNALS
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: phishguard-ai-demo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: phishguard-ai-demo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: phishguard-ai-demo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: phishguard-ai-demo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: phishguard-ai-demo-db
          property: password

databases:
  - name: phishguard-ai-demo-db
    databaseName: phishguard_db
    user: phishguard_user
    plan: free
    postgresMajorVersion: "16"
    region: oregon
    ipAllowList: []
