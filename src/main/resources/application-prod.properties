# ===================================================================
# PhishGuard AI - Application Configuration (Production Profile)
# ===================================================================
spring.application.name=phishguard-ai
server.port=${PORT:${SERVER_PORT:8080}}

# Production Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:phishguard_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:phishguard_user}
spring.datasource.password=${DB_PASSWORD}

# Production Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Adopt the existing Hibernate-managed schema at V1, then apply later migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Disable H2 Console in Production
spring.h2.console.enabled=false

# Disable API documentation in Production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Thymeleaf Caching Enabled for High Concurrency
spring.thymeleaf.cache=true

# Security Settings
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=${SESSION_TIMEOUT_MINUTES:30}m
# Trust forwarded headers only from the explicitly configured proxy source.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_INTERNALS:127[.]0[.]0[.]1|::1}

# Logging
logging.level.root=WARN
logging.level.com.phishguard=INFO
