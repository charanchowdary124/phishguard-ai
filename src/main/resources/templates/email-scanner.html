<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
<title>Email Scanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link th:href="@{/css/phishguard.css}" rel="stylesheet"></head>
<body><div class="app-shell"><aside class="sidebar">
<h2 class="h5 mb-4">PhishGuard AI</h2><a href="/dashboard">Dashboard</a><a href="/scan/url">Website Scanner</a><a class="active" href="/scan/email">Email Scanner</a><a href="/history">Scan History</a><a href="/analytics">Threat Analytics</a><a href="/profile">Profile</a>
<form method="post" action="/logout" class="mt-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-light btn-sm w-100" type="submit">Logout</button></form>
</aside><main class="main"><h1 class="h3 mb-4">Email Scanner</h1>
<div class="card"><div class="card-body"><form id="email-form" method="post" action="/api/scan/email">
<label class="form-label" for="sender">Sender</label><input class="form-control mb-3" id="sender" name="sender" maxlength="254">
<label class="form-label" for="subject">Subject</label><input class="form-control mb-3" id="subject" name="subject" maxlength="998">
<label class="form-label" for="body">Plain text or HTML body</label><textarea class="form-control mb-3" id="body" name="body" rows="8" maxlength="20000"></textarea>
<button class="btn btn-primary" type="submit">Analyze Email</button></form><div id="email-result" class="mt-3"></div></div></div>
</main></div>
<script th:src="@{/js/phishguard.js}"></script>
</body></html>
