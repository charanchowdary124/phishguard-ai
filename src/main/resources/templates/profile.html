<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
<title>User Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"><link th:href="@{/css/phishguard.css}" rel="stylesheet"></head>
<body><div class="app-shell"><aside class="sidebar"><h2 class="h5 mb-4">PhishGuard AI</h2><a href="/dashboard">Dashboard</a><a href="/scan/url">Website Scanner</a><a href="/scan/email">Email Scanner</a><a href="/history">Scan History</a><a href="/analytics">Threat Analytics</a><a class="active" href="/profile">Profile</a>
<form method="post" action="/logout" class="mt-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-light btn-sm w-100" type="submit">Logout</button></form></aside>
<main class="main"><h1 class="h3 mb-4">User Profile</h1><div id="profile-status" class="alert alert-info">Loading profile…</div>
<div class="card mb-3"><div class="card-body"><h2 class="h5">Account details</h2><p class="mb-1">Role: <strong id="profile-role">—</strong></p><p class="mb-0">Account created: <strong id="account-created">—</strong></p></div></div>
<form id="profile-update-form" class="card mb-3"><div class="card-body"><h2 class="h5">Update profile</h2>
<label class="form-label" for="profile-username">Username</label><input id="profile-username" name="username" class="form-control mb-3" minlength="3" maxlength="100" required>
<label class="form-label" for="profile-email">Email</label><input id="profile-email" name="email" type="email" class="form-control mb-3" maxlength="254" required>
<button class="btn btn-primary" type="submit">Save profile</button><div id="profile-update-result" class="mt-3" aria-live="polite"></div></div></form>
<form id="password-change-form" class="card"><div class="card-body"><h2 class="h5">Change password</h2>
<label class="form-label" for="current-password">Current password</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" class="form-control mb-3" maxlength="128" required>
<label class="form-label" for="new-password">New password</label><input id="new-password" name="newPassword" type="password" autocomplete="new-password" class="form-control mb-3" minlength="12" maxlength="128" required>
<label class="form-label" for="new-password-confirmation">Confirm new password</label><input id="new-password-confirmation" name="newPasswordConfirmation" type="password" autocomplete="new-password" class="form-control mb-3" minlength="12" maxlength="128" required>
<p class="text-secondary">Use at least 12 characters with uppercase, lowercase, a number, and a special character.</p>
<button class="btn btn-primary" type="submit">Change password</button><div id="password-change-result" class="mt-3" aria-live="polite"></div></div></form>
</main></div><script th:src="@{/js/phishguard.js}"></script></body></html>
