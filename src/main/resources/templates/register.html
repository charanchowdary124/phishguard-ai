<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>PhishGuard AI | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link th:href="@{/css/phishguard.css}" rel="stylesheet">
</head>
<body>
<main class="auth-page">
  <section class="card shadow">
    <div class="card-body p-4">
      <h1 class="h3 mb-3">Create account</h1>
      <form id="register-form" method="post" action="/api/auth/register">
        <label class="form-label" for="username">Username</label>
        <input class="form-control mb-3" id="username" name="username" minlength="3" required>
        <label class="form-label" for="email">Email</label>
        <input class="form-control mb-3" id="email" name="email" type="email" required>
        <label class="form-label" for="password">Password</label>
        <input class="form-control mb-3" id="password" name="password" type="password" minlength="12" required>
        <button class="btn btn-primary w-100" type="submit">Register</button>
      </form>
      <div id="register-result" class="mt-3"></div>
      <p class="mt-3 mb-0"><a href="/login">Back to login</a></p>
    </div>
  </section>
</main>
<script th:src="@{/js/phishguard.js}"></script>
</body>
</html>
