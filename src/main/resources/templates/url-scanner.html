<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
<title>Website Scanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link th:href="@{/css/phishguard.css}" rel="stylesheet"></head>
<body><div class="app-shell"><aside class="sidebar">
<h2 class="h5 mb-4">PhishGuard AI</h2><a href="/dashboard">Dashboard</a><a class="active" href="/scan/url">Website Scanner</a><a href="/scan/email">Email Scanner</a><a href="/history">Scan History</a><a href="/analytics">Threat Analytics</a><a href="/profile">Profile</a>
<form method="post" action="/logout" class="mt-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-light btn-sm w-100" type="submit">Logout</button></form>
</aside><main class="main"><h1 class="h3 mb-4">Website Scanner</h1>
<div class="card"><div class="card-body"><form id="url-form" method="post" action="/api/scan/url">
<label class="form-label" for="url">URL</label><input class="form-control mb-3" id="url" name="url" maxlength="2048" placeholder="https://example.com" required>
<button class="btn btn-primary" type="submit">Analyze URL</button></form><div id="url-result" class="mt-3"></div></div></div>
</main></div>
<script th:src="@{/js/phishguard.js}"></script>
</body></html>
