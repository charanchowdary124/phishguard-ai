<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>PhishGuard AI | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link th:href="@{/css/phishguard.css}" rel="stylesheet">
</head>
<body>
<main class="auth-page">
  <section class="card shadow">
    <div class="card-body p-4">
      <h1 class="h3 mb-3">PhishGuard AI</h1>
      <p class="text-secondary">Sign in to the threat analysis dashboard.</p>
      <form method="post" action="/login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="form-label" for="username">Username</label>
        <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
        <label class="form-label" for="password">Password</label>
        <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <div th:if="${param.registered}" class="alert alert-success mt-3">Account created successfully. Sign in with your new account.</div>
      <div th:if="${param.error}" class="alert alert-danger mt-3">Invalid username or password.</div>
      <div th:if="${param.logout}" class="alert alert-success mt-3">Signed out successfully.</div>
      <p class="mt-3 mb-0"><a href="/register">Create an account</a></p>
    </div>
  </section>
</main>
</body>
</html>
