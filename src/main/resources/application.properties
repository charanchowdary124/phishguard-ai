# ===================================================================
# PhishGuard AI - Application Configuration (Default: Dev / Local)
# ===================================================================
spring.application.name=phishguard-ai
server.port=${SERVER_PORT:8080}

# Database Configuration (In-Memory H2 with PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:phishguard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Local development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Thymeleaf Template Engine
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# File Upload Limits (For Bulk URL / Email Scan)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Security & Session Properties
server.servlet.session.timeout=${SESSION_TIMEOUT_MINUTES:30}m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
phishguard.security.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

# Model & Storage Paths
phishguard.ml.model-dir=${ML_MODEL_DIR:./data/models}
phishguard.ml.dataset-dir=${DATASET_DIR:./data/datasets}

# Logging
logging.level.root=INFO
logging.level.com.phishguard=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
